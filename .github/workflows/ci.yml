name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # strata-engine builds PROJ from source; PROJ's CMake needs the sqlite3 command-line tool to make proj.db
      # (the runner has CMake but no sqlite3). Official SQLite 3.46.0 tools, same version as the bundled library.
      - name: Put SQLite 3.46.0 command-line tool on PATH
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sqlite-tools.zip"
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-tools-win-x64-3460000.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "adbefda5f92d471cbde9cb3232775485bd1bad61ba97376c9661c37dfd6ad027") { throw "sqlite-tools sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sqlite-tools"
          "$env:RUNNER_TEMP\sqlite-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Workspace Unit Tests
        run: cargo test --workspace
      - name: Run V1-V14 Verification Harness
        run: cargo run -p strata-app --bin ka-hgis -- --verify-all

  # Feature `gdal` (submit SHP writer and package builder) in its own job, so a failure elsewhere never skips it.
  gdal-feature:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Same sqlite3 tool as above: strata-engine builds PROJ from source in this job too.
      - name: Put SQLite 3.46.0 command-line tool on PATH
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sqlite-tools.zip"
          Invoke-WebRequest -Uri "https://www.sqlite.org/2024/sqlite-tools-win-x64-3460000.zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "adbefda5f92d471cbde9cb3232775485bd1bad61ba97376c9661c37dfd6ad027") { throw "sqlite-tools sha256 mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\sqlite-tools"
          "$env:RUNNER_TEMP\sqlite-tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # GDAL 3.12.1 is built from source by gdal-src (gdal-sys feature `bundled`) with the ESRI Shapefile and GPKG
      # drivers only, and the PROJ 9.8.1 proj.db the cpp packages were made with ships inside strata-engine.
      # Nothing but the sqlite3 tool above is downloaded, and no GDAL or PROJ variable is set.
      - name: Run Clippy and tests for strata-engine and strata-check-export --features gdal
        shell: pwsh
        run: |
          foreach ($crate in @("strata-engine", "strata-check-export")) {
            cargo clippy -p $crate --features gdal --all-targets -- -D warnings
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cargo test -p $crate --features gdal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
