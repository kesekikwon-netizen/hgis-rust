[package]
name = "strata-refmap"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Reference maps fetched from public map services (geology, soil, rivers, parcels): the request forms, the
# checks on the answers, and what is kept in the survey folder, as the C++ GeologyMapService, SoilMapService,
# RiverMapService, ReferenceTiledFetch and PreparedReferenceMap do it. No request is sent from here: the
# caller hands in the function that fetches, so that every test runs on recorded answers.

[lints]
workspace = true

[dependencies]
strata-engine = { workspace = true, features = ["gdal"] }
# The 지적 run: the site session and the list of archives (strata-net), the unpacking (strata-topo).
strata-net = { workspace = true }
strata-topo = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
# The draft of a table is written in a folder of its own beside the finished one (QTemporaryDir in the C++).
tempfile = { workspace = true }

[dev-dependencies]
# Tests pack the county archive the made-up site sends.
zip = { workspace = true }
# Tests write the shapefiles they read (the same GDAL the engine builds).
gdal = "=0.19.0"
