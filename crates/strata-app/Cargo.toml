[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ka-hgis"
path = "src/main.rs"

[dependencies]
strata-types = { workspace = true }
strata-secrets = { workspace = true }
strata-storage = { workspace = true }
strata-geo = { workspace = true }
image = { workspace = true }
strata-net = { workspace = true }
strata-paleo = { workspace = true }
strata-canvas2d = { workspace = true }
strata-terrain3d = { workspace = true }
strata-layout = { workspace = true }
strata-check-export = { workspace = true }
strata-engine = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
geo = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
# 그린 도형의 uid(C++ QUuid::createUuid) — v4.
uuid = { version = "=1.29.0", features = ["v4"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }

[dev-dependencies]
strata-net = { workspace = true, features = ["test-probe"] }
tempfile.workspace = true

[lints]
workspace = true
