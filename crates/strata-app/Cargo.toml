[package]
name = "strata-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ka-hgis"
path = "src/main.rs"

[dependencies]
strata-types = { workspace = true }
strata-secrets = { workspace = true }
strata-storage = { workspace = true }
strata-geo = { workspace = true }
image = { workspace = true }
strata-net = { workspace = true }
strata-paleo = { workspace = true }
strata-canvas2d = { workspace = true }
strata-terrain3d = { workspace = true }
strata-layout = { workspace = true }
strata-check-export = { workspace = true }
# gdal: reference maps are kept as GeoPackage tables and received sheets are DXF, both through GDAL as in the C++
# (PreparedReferenceMap.cpp:131-155, TopographicCatalog.cpp:181-209). Built from source by gdal-src (MIT).
strata-engine = { workspace = true, features = ["gdal"] }
strata-refmap = { workspace = true }
strata-mapengine = { workspace = true }
strata-topo = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
geo = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rfd = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
# 그린 도형의 uid(C++ QUuid::createUuid) — v4.
uuid = { version = "=1.29.0", features = ["v4"] }
rodio = { version = "=0.23.0", default-features = false, features = ["playback"] }
# Large reference layers (sheet lines, parcels, geology) are drawn into a picture off the UI thread.
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
strata-ngii-run = { path = "../strata-ngii-run" }

[dev-dependencies]
strata-net = { workspace = true, features = ["test-probe"] }
tempfile.workspace = true
# Tests write the ZIP the NGII portal sends a DEM in (the crate is already in the workspace: strata-topo).
zip = { workspace = true }

[lints]
workspace = true
