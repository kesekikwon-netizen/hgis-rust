[workspace]
resolver = "2"
members = [
    "crates/strata-types",
    "crates/strata-secrets",
    "crates/strata-storage",
    "crates/strata-geo",
    "crates/strata-net",
    "crates/strata-paleo",
    "crates/strata-canvas2d",
    "crates/strata-terrain3d",
    "crates/strata-layout",
    "crates/strata-check-export",
    "crates/strata-app",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Dongguk Cultural Heritage Research Institute · STRATA Engineering Team"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
geo = "0.29"
rstar = "0.12"
spade = "2.12"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
tempfile = "3.13"
eframe = { version = "0.31", features = ["glow"] }
egui = "0.31"
rfd = "0.15"
wgpu = { version = "24.0.5", features = ["wgsl"] }
lyon = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
strata-types = { path = "crates/strata-types" }
strata-secrets = { path = "crates/strata-secrets" }
strata-storage = { path = "crates/strata-storage" }
strata-geo = { path = "crates/strata-geo" }
strata-net = { path = "crates/strata-net" }
strata-paleo = { path = "crates/strata-paleo" }
strata-canvas2d = { path = "crates/strata-canvas2d" }
strata-terrain3d = { path = "crates/strata-terrain3d" }
strata-layout = { path = "crates/strata-layout" }
strata-check-export = { path = "crates/strata-check-export" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
