[package]
name = "strata-check-export"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strata-types = { path = "../strata-types" }
strata-storage = { path = "../strata-storage" }
strata-layout = { path = "../strata-layout" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
# R2-2 submit package builder (feature `gdal`; the app does not enable it until R2-3).
strata-engine = { path = "../strata-engine", optional = true }
tempfile = { workspace = true }
chrono = { workspace = true, optional = true }
iana-time-zone = { version = "=0.1.65", optional = true }

[features]
gdal = ["dep:strata-engine", "strata-engine/gdal", "dep:chrono", "dep:iana-time-zone"]

[lints]
workspace = true
